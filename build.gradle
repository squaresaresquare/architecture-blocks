plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
sourceSets {
	main {
		ext.refMap = "${modid}.refmap.json"
	}
}
loom {
	mixin {
		useLegacyMixinAp = false
		defaultRefmapName = "${modid}.refmap.json"
	}

	runs {
		configureEach {
			hasProperty("enable-preview")
			property("mixin.debug.export", "true")
		}
	}
}

repositories {
	mavenCentral()
	maven {
		url = uri("https://oss.sonatype.org/content/repositories/snapshots/")
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 26
}
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['--enable-preview']
}
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "--enable-preview"
}
tasks.withType(JavaExec).configureEach {
	jvmArgs += '--enable-preview'
}
tasks.register('copyTexturesToGenerated', Copy) {
	group = 'custom'
	description = 'copy thumbnails to generated'
	def sourceDir = layout.projectDirectory.dir('src/main/resources/assets/architecture-blocks/textures/painting_buttons')
	def destDir = layout.projectDirectory.dir('src/main/generated/assets/architecture-blocks/textures/item')
	from(sourceDir)
	into(destDir)
	include '**/*'
	outputs.upToDateWhen { false }
	doFirst {
		def files = sourceDir.getAsFile().listFiles()
		if (files == null || files.length == 0) {
			logger.warn("WARNING: Source directory is empty or does not exist: ${sourceDir.getAsFile().absolutePath}")
		} else {
			logger.lifecycle("Found ${files.length} files to copy from source.")
		}
	}
	doLast {
		logger.lifecycle("Successfully copied custom thumbnails to generated assets!")
	}
	// Force Gradle to ignore its internal cache tracking for this specific folder bridge
	outputs.upToDateWhen { false }

	doLast {
		logger.lifecycle("Successfully copied custom thumbnails to generated assets!")
	}
}
tasks.matching { it.name.startsWith('runDatagen') }.configureEach {
	finalizedBy 'copyTexturesToGenerated'
}
java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility <= JavaVersion.VERSION_26
	targetCompatibility <= JavaVersion.VERSION_26
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def void expand(LinkedHashMap<String, Object> stringObjectLinkedHashMap) {}